name: Build
on: push

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --noconsole --name PingCheck pingcheck.py
      - uses: actions/upload-artifact@v4
        with:
          name: PingCheck-windows
          path: dist/PingCheck.exe

  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y python3-tk python3-requests xvfb scrot
      - run: |
          Xvfb :99 -screen 0 500x800x24 &
          sleep 2
          DISPLAY=:99 python3 pingcheck.py &
          sleep 12
          DISPLAY=:99 scrot screenshot.png
      - uses: actions/upload-artifact@v4
        with:
          name: app-screenshot
          path: screenshot.png
